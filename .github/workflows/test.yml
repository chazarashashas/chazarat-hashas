name: Test

# Runs on every push and every pull request. This does not, on its own,
# block the Vercel deploy that already happens on push to main — Vercel
# deploys independently of this workflow's result. It reports pass/fail
# on every push (visible on GitHub) and blocks merging a PR once branch
# protection requires it, but blocking a direct push to main from
# actually deploying would need switching this repo to a PR-only
# workflow with that branch protection turned on, which is a bigger
# process change than adding CI itself.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24, not 20: jsdom loads undici, and undici destructures
          # markAsUncloneable out of node:worker_threads, which only exists
          # from Node 20.19 / 22.10 on. On an older 20.x it comes back
          # undefined, every vitest worker dies before it loads a single
          # test file, and the run reports "Test Files: 0" and fails. 24 is
          # also what this project is developed on, so CI and the desk now
          # run the same runtime.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b --noEmit
      - run: npm test
      - run: npm run build
      # The visual-consistency guards: a literal colour outside theme.css,
      # or a font-size off the scale, fails the build.
      - run: bash scripts/check-colors.sh
      - run: bash scripts/check-type.sh
